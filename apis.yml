aid: wispr-flow
name: Wispr Flow
description: Wispr Flow is a voice-to-text dictation application from Wispr that lets
  people type roughly 4x faster by speaking naturally in any app or field on macOS,
  Windows, iOS, and Android. It uses AI models for accurate, context-aware transcription
  in 100+ languages, applying AI auto-edits that remove filler words and fix grammar,
  a personal dictionary for names and jargon, voice snippets for reusable templates,
  and tone styling. Enterprise features include SSO, SCIM user provisioning, MDM
  deployment, a privacy/zero-retention mode, and compliance posture covering SOC 2
  Type II, ISO/IEC 27001, and HIPAA. Wispr Flow ships as consumer and enterprise
  desktop/mobile apps rather than a public developer API. It was surfaced as a portfolio
  company of Menlo Ventures.
